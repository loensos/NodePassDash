<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入门项目</title>
<style>
  :root { --bg: #ffffff; --fg: #0b0b0f; --muted: #6b7280; --accent: #4f46e5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  main { max-width: 40rem; padding: 2rem; text-align: center; }
  h1 { font-size: 2.5rem; line-height: 1.1; margin: 0 0 1rem; letter-spacing: -0.02em; }
  p { font-size: 1.125rem; color: var(--muted); margin: 0 0 2rem; }
  a.cta {
    display: inline-block; padding: 0.75rem 1.5rem; border-radius: 0.5rem;
    background: var(--accent); color: #ffffff; text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <h1>入门项目</h1>
  <p>Your new project is ready. Edit this page to make it yours.</p>
  <a class="cta" href="#">Get started</a>
</main>
</body>
</html>
